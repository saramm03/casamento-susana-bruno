<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Susana & Bruno</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #ffe6eb, #fff5f7);
      color: #333;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .card {
      background: white;
      max-width: 700px;
      width: 100%;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      padding: 40px 25px;
      text-align: center;
    }

    .top-text {
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c05a7a;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
      color: #b03060;
    }

    .subtitle {
      font-size: 20px;
      margin-bottom: 25px;
      color: #666;
    }

    .date {
      font-size: 24px;
      font-weight: bold;
      color: #e91e63;
      margin-bottom: 10px;
    }

    .place {
      font-size: 18px;
      margin-bottom: 30px;
      color: #555;
    }

    .message {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
      color: #444;
    }

    .button {
      padding: 15px 28px;
      font-size: 18px;
      background: #e91e63;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .button:hover {
      transform: scale(1.03);
      background: #d81b60;
    }

    .note {
      margin-top: 18px;
      font-size: 14px;
      color: #888;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }

      .subtitle {
        font-size: 18px;
      }

      .message {
        font-size: 16px;
      }

      .date {
        font-size: 21px;
      }

      .place {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <audio id="musica" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <section class="hero">
    <div class="card">
      <div class="top-text">Convite Especial</div>
      <h1>Susana & Bruno 💍</h1>
      <p class="subtitle">Vamos casar!</p>

      <p class="date">27 de Julho de 2026</p>
      <p class="place">Quinta Exemplo, Portugal</p>

      <p class="message">
        Com muita alegria, convidamos-te para celebrar connosco
        este dia tão especial. A tua presença tornará este momento
        ainda mais inesquecível.
      </p>

      <button class="button" onclick="startMusic()">Ouvir música ♫</button>
      <p class="note">A música começa quando carregares no botão.</p>
    </div>
  </section>

  <script>
    function startMusic() {
      document.getElementById("musica").play();
    }
  </script>

</body>
</html>
