<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Susana & Bruno</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(180deg, #ffe6eb, #fff);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

h1 {
  margin-bottom: 20px;
}

.button {
  display: block;
  margin: 10px auto;
  padding: 15px 25px;
  font-size: 18px;
  background: #e91e63;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<audio id="musica" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <h1>Susana & Bruno 💍</h1>

  <button class="button" onclick="toggleMusic()">
    🎵 Ligar / Pausar Música
  </button>

  <button class="button" onclick="abrirConvite()">
    💌 Ver Convite
  </button>
</div>

<script>
let playing = false;

function toggleMusic() {
  const audio = document.getElementById("musica");

  if (playing) {
    audio.pause();
  } else {
    audio.play();
  }

  playing = !playing;
}

function abrirConvite() {
  window.open("https://susanaebruno-casamento.my.canva.site/dahfqczkjou", "_blank");
}
</script>

</body>
</html>
